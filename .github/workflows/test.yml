name: test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Batería completa (sin red ni almacenes reales) en los tres sistemas.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 18 }
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 18 }
          - { os: windows-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # Almacén de secretos REAL de cada sistema (servicio de prueba aleatorio, se borra al terminar).
  store-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install GNOME Keyring and secret-tool
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-tools dbus-x11
      - name: Secret Service (GNOME Keyring)
        run: |
          dbus-run-session -- sh -c '
            echo -n "ci-password" | gnome-keyring-daemon --unlock --replace --daemonize --components=secrets >/dev/null
            node tests/store-live.mjs'
      - name: Without a Secret Service the error explains the fix
        # D-Bus apuntando a un socket inexistente simula un servidor sin escritorio ni llavero.
        env:
          DBUS_SESSION_BUS_ADDRESS: unix:path=/nonexistent/soundcrate-bus
        run: |
          node --input-type=module -e '
            const { createStore } = await import("./secrets.mjs");
            const s = createStore();
            const p = s.probe();
            console.log(JSON.stringify(p));
            if (p.ok || !/SC_SECRET_STORE=file/.test(p.problem)) process.exit(1);
            try { s.set("probe_account", "value12345"); process.exit(1); }
            catch (e) { console.log(e.name, "-", e.message); if (!e.setup) process.exit(1); }'
      - name: File fallback
        run: SC_SECRET_STORE=file node tests/store-live.mjs

  store-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Temporary unlocked keychain
        run: |
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security set-keychain-settings ci.keychain
      - run: node tests/store-live.mjs
      - run: SC_SECRET_STORE=file node tests/store-live.mjs

  store-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Windows Credential Manager
        run: node tests/store-live.mjs
      - name: File fallback
        shell: bash
        run: SC_SECRET_STORE=file node tests/store-live.mjs

  # Extensión de Claude Desktop (.mcpb): validarla y empaquetarla con la herramienta oficial.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
      - run: npx -y @anthropic-ai/mcpb@2.1.2 pack . soundcrate.mcpb
      - name: The bundle contains only the server and its metadata
        run: |
          unzip -Z1 soundcrate.mcpb | sort | tee files.txt
          for f in manifest.json server.mjs lib.mjs secrets.mjs setup.mjs icon.png LICENSE PRIVACY.md; do grep -qx "$f" files.txt || { echo "missing $f"; exit 1; }; done
          if grep -E '^(tests/|\.github/|skills/|\.claude-plugin/)' files.txt; then echo "unexpected files"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: soundcrate-mcpb
          path: soundcrate.mcpb

